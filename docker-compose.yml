services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: perntodo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pern-todo/server/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./pern-todo/server
    ports:
      - "5001:5001"
    environment:
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_HOST: db
      PG_PORT: 5432
      PG_DATABASE: perntodo
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./pern-todo/client
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5001
      HOST: 0.0.0.0
    depends_on:
      - server

volumes:
  pgdata:
